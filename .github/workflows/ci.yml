name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_TOKEN: ci-dummy
      REDIS_URL: "fake://"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t day12-chat:ci .

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discover Railway Context
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          token_info=$(curl --fail --silent --show-error \
            https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')

          project_id=$(echo "$token_info" | jq -r '.data.projectToken.projectId // empty')
          environment_id=$(echo "$token_info" | jq -r '.data.projectToken.environmentId // empty')
          if [ -z "$project_id" ] || [ -z "$environment_id" ]; then
            echo "::error::Unable to discover Railway project context from RAILWAY_TOKEN"
            echo "$token_info" | jq -c '{errors: .errors}'
            exit 1
          fi

          echo "::notice title=RAILWAY_PROJECT_ID::$project_id"
          echo "::notice title=RAILWAY_ENVIRONMENT_ID::$environment_id"

          query=$(jq -nc --arg id "$project_id" '{
            query: "query($id: String!) { project(id: $id) { services { edges { node { id name } } } } }",
            variables: {id: $id}
          }')
          services=$(curl --fail --silent --show-error \
            https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$query")
          echo "$services" | jq -r \
            '.data.project.services.edges[]?.node | "::notice title=RAILWAY_SERVICE_ID::\(.name)=\(.id)"'

      - name: Validate Deploy Configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$PUBLIC_URL" in
            https://*) ;;
            *) echo "::error::PUBLIC_URL must start with https://"; exit 1 ;;
          esac

      - name: Deploy to Cloud
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          npm install --global @railway/cli
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID"

      - name: Smoke Test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          BASE_URL="${PUBLIC_URL%/}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$BASE_URL/healthz" && \
               curl --fail --silent --show-error --max-time 10 "$BASE_URL/readyz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Service did not become healthy after deployment" >&2
          exit 1
