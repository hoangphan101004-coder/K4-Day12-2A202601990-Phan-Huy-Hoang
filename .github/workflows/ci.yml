name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_TOKEN: ci-dummy
      REDIS_URL: "fake://"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build -t day12-chat:ci .

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Discover Railway Context
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          token_info=$(curl --fail --silent --show-error \
            https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')

          project_id=$(echo "$token_info" | jq -r '.data.projectToken.projectId // empty')
          environment_id=$(echo "$token_info" | jq -r '.data.projectToken.environmentId // empty')
          if [ -z "$project_id" ] || [ -z "$environment_id" ]; then
            echo "::error::Unable to discover Railway project context from RAILWAY_TOKEN"
            echo "$token_info" | jq -c '{errors: .errors}'
            exit 1
          fi

          echo "::notice title=RAILWAY_PROJECT_ID::$project_id"
          echo "::notice title=RAILWAY_ENVIRONMENT_ID::$environment_id"

          query=$(jq -nc --arg id "$project_id" '{
            query: "query($id: String!) { project(id: $id) { services { edges { node { id name } } } } }",
            variables: {id: $id}
          }')
          services=$(curl --fail --silent --show-error \
            https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$query")
          echo "$services" | jq -r \
            '.data.project.services.edges[]?.node | "::notice title=RAILWAY_SERVICE_ID::\(.name)=\(.id)"'

          repo_name="${GITHUB_REPOSITORY#*/}"
          service_id=$(echo "$services" | jq -r --arg name "$repo_name" \
            '.data.project.services.edges[]?.node | select(.name == $name) | .id' | head -n 1)
          if [ -z "$service_id" ]; then
            service_count=$(echo "$services" | jq \
              '[.data.project.services.edges[]?.node] | length')
            if [ "$service_count" -eq 1 ]; then
              service_id=$(echo "$services" | jq -r \
                '.data.project.services.edges[0].node.id')
            else
              echo "::error::Unable to select the application service automatically"
              exit 1
            fi
          fi

          public_url="${{ vars.PUBLIC_URL }}"
          if [ -z "$public_url" ]; then
            public_url="https://k4-day12-2a202601990-phan-huy-hoang.up.railway.app"
          fi
          echo "RAILWAY_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "RAILWAY_ENVIRONMENT_ID=$environment_id" >> "$GITHUB_ENV"
          echo "RAILWAY_SERVICE_ID=$service_id" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$public_url" >> "$GITHUB_ENV"

      - name: Validate Deploy Configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$PUBLIC_URL" in
            https://*) ;;
            *) echo "::error::PUBLIC_URL must start with https://"; exit 1 ;;
          esac

      - name: Deploy to Cloud
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli
          set +e
          deploy_output=$(railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" 2>&1)
          deploy_status=$?
          set -e
          printf '%s\n' "$deploy_output"
          if [ "$deploy_status" -ne 0 ]; then
            summary=$(printf '%s\n' "$deploy_output" \
              | sed -r 's/\x1B\[[0-9;]*[mK]//g' \
              | tail -n 12 \
              | tr '\n' ' ')
            echo "::error title=Railway deploy failed::$summary"

            runtime_logs=$(railway logs --latest --lines 80 \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVICE_ID" 2>&1 || true)
            printf '%s\n' "$runtime_logs"
            runtime_summary=$(printf '%s\n' "$runtime_logs" \
              | sed -r 's/\x1B\[[0-9;]*[mK]//g' \
              | tail -n 20 \
              | tr '\n' ' ' \
              | cut -c 1-3000)
            echo "::error title=Railway runtime logs::$runtime_summary"
            exit "$deploy_status"
          fi

      - name: Smoke Test
        run: |
          BASE_URL="${PUBLIC_URL%/}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$BASE_URL/healthz" && \
               curl --fail --silent --show-error --max-time 10 "$BASE_URL/readyz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Service did not become healthy after deployment" >&2
          exit 1
